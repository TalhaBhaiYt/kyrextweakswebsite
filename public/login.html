<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – KyrexTweaks</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="toast-container"></div>

<!-- Navbar -->
<nav class="navbar">
  <a href="/" class="nav-logo">KyrexTweaks</a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/register.html" class="btn btn-primary btn-sm">Register</a>
  </div>
</nav>

<!-- Background glow -->
<div style="position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(220,20,60,0.1) 0%,transparent 65%);pointer-events:none;z-index:0;"></div>

<!-- Auth page -->
<main class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">KyrexTweaks</div>
    <p class="auth-subtitle">Sign in to access your downloads</p>

    <form class="auth-form" id="loginForm" novalidate>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input
          class="form-control" type="email" id="email"
          placeholder="you@example.com" autocomplete="email" required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div style="position:relative;">
          <input
            class="form-control" type="password" id="password"
            placeholder="Your password" autocomplete="current-password" required
            style="padding-right:44px;"
          />
          <button type="button" id="togglePw"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-dim);cursor:pointer;line-height:1;display:flex;align-items:center;"
            title="Toggle password visibility"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span></button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;margin-top:4px;">
        <span id="btnText">Sign In</span>
        <span id="btnSpinner" class="spinner" style="display:none;width:18px;height:18px;"></span>
      </button>

      <div id="errorBox" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.35);border-radius:var(--radius);padding:12px 14px;font-size:0.88rem;color:#fca5a5;"></div>

    </form>

    <div class="divider"></div>

    <div class="auth-footer">
      Don't have an account? <a href="/register.html">Create one free</a>
    </div>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
  /* Redirect if already logged in */
  (function () {
    const token = localStorage.getItem('kyrex_token');
    if (!token) return;
    try {
      const p = JSON.parse(atob(token.split('.')[1]));
      if (p.exp * 1000 > Date.now()) {
        window.location.href = p.role === 'admin' ? '/admin.html' : '/dashboard.html';
      }
    } catch {}
  })();

  /* Toggle password visibility */
  document.getElementById('togglePw').addEventListener('click', function () {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });

  /* Login form */
  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('submitBtn');
    const btnText  = document.getElementById('btnText');
    const spinner  = document.getElementById('btnSpinner');
    const errorBox = document.getElementById('errorBox');

    errorBox.style.display = 'none';
    btn.disabled   = true;
    btnText.style.display  = 'none';
    spinner.style.display  = 'inline-block';

    try {
      const res  = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        errorBox.textContent   = data.error || 'Login failed';
        errorBox.style.display = 'block';
        return;
      }

      localStorage.setItem('kyrex_token', data.token);
      localStorage.setItem('kyrex_user',  JSON.stringify(data.user));
      showToast('Welcome back, ' + data.user.username + '!', 'success');

      setTimeout(() => {
        window.location.href = data.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
      }, 600);

    } catch {
      errorBox.textContent   = 'Network error. Please try again.';
      errorBox.style.display = 'block';
    } finally {
      btn.disabled          = false;
      btnText.style.display  = 'inline';
      spinner.style.display  = 'none';
    }
  });
</script>
<script src="/js/fx.js"></script>
</body>
</html>
